services:
  # 1. FastAPI Scientific Backend
  - type: web
    name: crystal-x-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GENERATOR_MODE
        value: demo
      - key: PYTHONPATH
        value: .
    plan: free

  # 2. Next.js Scientific Research Frontend
  - type: web
    name: crystal-x-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: crystal-x-backend
          property: url
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: crystal-x-backend
          property: url
          format: "{url}/api"
    plan: free
